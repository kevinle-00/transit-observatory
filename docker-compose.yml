services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: transit_observatory
      POSTGRES_USER: transit
      POSTGRES_PASSWORD: transit
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transit -d transit_observatory"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  postgres_data:
